# Modified from anthropics/jacobian-lens by Tung-Yu (Tony) Wu and his Claude.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jcircuits"
version = "0.1.0"
description = "J-circuits: concept-level attribution graphs over the Jacobian lens"
authors = [{ name = "Tung-Yu (Tony) Wu" }]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "torch",
    "huggingface_hub",
    "transformers>=5.5",
    "numpy",
]

[project.urls]
Repository = "https://github.com/tony10101105/j-circuits"
Upstream = "https://github.com/anthropics/jacobian-lens"
"Upstream paper" = "https://transformer-circuits.pub/2026/workspace/index.html"

[project.optional-dependencies]
dev = ["pytest", "ruff", "datasets"]
# jlens.token_filter only; nothing else in the package calls out to a network.
llm = ["anthropic"]

[tool.ruff]
line-length = 88
target-version = "py310"
# One-off measurement scripts and their outputs; kept for reproducibility, not
# held to the library's lint rules.
exclude = ["exp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]

[tool.setuptools]
packages = ["jlens"]

[tool.setuptools.package-data]
jlens = ["data/*"]
